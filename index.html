<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priya Weds Vipin | Wedding Memories</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #fff7f2;
      color: #632b40;
      text-align: center;
    }

    header {
      background: #702b45;
      color: white;
      padding: 18px;
      letter-spacing: 2px;
    }

    main {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .heart {
      color: #b64060;
      font-size: 48px;
    }

    h1 {
      font-size: clamp(38px, 9vw, 64px);
      margin: 12px 0;
    }

    p {
      line-height: 1.7;
      font-size: 18px;
    }

    .button {
      background: #702b45;
      color: white;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 30px;
      margin-top: 16px;
    }

    footer {
      background: #f0ded7;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>OUR WEDDING MEMORIES</header>

  <main>
    <div class="heart">♥️</div>
    <p>A beautiful journey of love</p>
    <h1>Priya Weds Vipin</h1>
    <p>
      Two hearts, one beautiful story.<br>
      Our memories, forever together.
    </p>

    <a class="button" href="#memories">
      Explore Our Memories
    </a>

    <section id="memories">
      <p>Our special memories are coming soon...</p>
    </section>
  </main>

  <footer>Made with love ♥️ Priya &amp; Vipin</footer>
</body>
</html>
